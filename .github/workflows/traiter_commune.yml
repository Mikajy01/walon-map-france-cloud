name: Traiter une commune

on:
  workflow_dispatch:
    inputs:
      commune:
        description: "Nom de la commune"
        required: true
        type: string
      departement:
        description: "Département (code '01' ou nom 'Ain')"
        required: true
        type: string
      code_postal:
        description: "Code postal"
        required: true
        type: string
      rues:
        description: "Rues à traiter, séparées par des virgules (ex: Rue du Lardon, Montée du Mollard). Vide = découvre et traite TOUTE la commune."
        required: false
        type: string
      mode:
        description: "traiter_commune : découvre et traite toutes les rues (retente aussi les cellules ERREUR en fin de run si complet). retenter_erreurs : ne retente QUE les cellules ERREUR déjà trackées (WFS Géorisques + bloc H→HV), jamais les cellules Manuellement."
        required: true
        type: choice
        default: traiter_commune
        options:
          - traiter_commune
          - retenter_erreurs
      traitement:
        description: "continuer (sûr, défaut) reprend l'état existant. nouveau réinitialise le fichier de cette commune depuis le gabarit officiel — DESTRUCTIF."
        required: true
        type: choice
        default: continuer
        options:
          - continuer
          - nouveau

# Nécessaire pour committer l'état (Excel + registre) à la fin du run —
# voir le plan cloud (2026-08-20) : l'Excel EST la source de vérité de
# progression, il doit être commité pour que le run suivant puisse
# "continuer" dessus.
permissions:
  contents: write

jobs:
  traiter:
    runs-on: ubuntu-latest
    # Empêche deux runs sur la MÊME commune de tourner en parallèle — le
    # step de commit final touche le même fichier state/{code_insee}_
    # {commune}.xlsx pour les deux, un vrai conflit de fusion sur un
    # binaire n'étant pas auto-résolvable (contrairement au cas "push de
    # code pendant le run", voir plus bas). Des communes différentes
    # restent traitées en parallèle sans souci (fichiers distincts).
    concurrency:
      group: traiter-commune-${{ inputs.commune }}-${{ inputs.code_postal }}
      cancel-in-progress: false
    # Garde-fou DUR, légèrement au-dessus du budget interne de
    # --budget-heures (5.5h par défaut, voir main.py::parse_args) — le
    # budget interne doit TOUJOURS déclencher l'arrêt propre avant que
    # GitHub ne tue le job de force (ce qui pourrait corrompre l'Excel
    # en plein `.save()`, incident déjà rencontré sur ce projet).
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # Cache HTTP : PERFORMANCE uniquement, jamais une source de
      # vérité (voir .gitignore) — accélère les runs répétés sur la
      # même commune, sans jamais être commité dans le repo.
      - name: Restaurer le cache HTTP
        uses: actions/cache@v4
        with:
          path: cache
          key: http-cache-${{ inputs.commune }}-${{ github.run_id }}
          restore-keys: |
            http-cache-${{ inputs.commune }}-

      # `continue-on-error` : le code de sortie 75 (voir main.py::main)
      # signale un run INCOMPLET (budget atteint) — pas un échec, l'état
      # déjà sauvegardé doit quand même être commité, jamais perdu.
      # Volontairement pas plus fin qu'un simple "continue" même pour un
      # VRAI crash (exit non-zéro inattendu) : la durabilité par
      # parcelle (voir main.py::traiter_rue) garantit que l'état sur
      # disque reste toujours cohérent, donc committer tel quel est
      # toujours sûr, peu importe la cause de l'arrêt.
      - name: Lancer le traitement
        id: traitement
        continue-on-error: true
        run: |
          python main.py \
            --commune "${{ inputs.commune }}" \
            --departement "${{ inputs.departement }}" \
            --code-postal "${{ inputs.code_postal }}" \
            --rues "${{ inputs.rues }}" \
            --mode "${{ inputs.mode }}" \
            --traitement "${{ inputs.traitement }}" \
            --budget-heures 5.5

      - name: Signaler un run incomplet ou en erreur
        if: steps.traitement.outcome == 'failure'
        run: echo "::warning::Le traitement de '${{ inputs.commune }}' s'est arrêté avant la fin (budget de temps atteint, ou erreur — voir les logs ci-dessus). L'état déjà calculé est commité normalement ; relance le workflow en mode 'continuer' pour reprendre."

      # Le cache HTTP (voir "Restaurer le cache HTTP" plus haut) se
      # sauvegarde automatiquement en fin de job via le post-step natif
      # d'`actions/cache@v4` (la clé exacte incluant `github.run_id` ne
      # matche jamais au restore, donc la sauvegarde finale a toujours
      # lieu) — pas besoin d'un step `actions/cache/save` séparé.
      # `git push` seul, sans re-synchro avec origin, se fait rejeter dès
      # que main a avancé depuis le checkout (ex: un push de code pendant
      # le run, un run précédent pas encore mergé) — incident réel vécu
      # le 2026-08-21 : un run entier perdu, le commit local existant
      # seulement sur la VM éphémère du runner, jamais récupérable une
      # fois le job terminé en erreur. `git fetch` + `git rebase` avant
      # de pousser rejoue notre commit par-dessus les commits distants —
      # jamais un simple `push --force`, qui écraserait le travail
      # distant au lieu de le préserver.
      #
      # DEUX cas bien distincts pour l'échec du rebase (distinction
      # ajoutée après un second incident réel, 2026-08-21, où le run
      # précédent a laissé le job planté en boucle sur un VRAI conflit) :
      #   - Rejet SIMPLE (pas de conflit, juste un retard de
      #     synchronisation) : le rebase réussit, on retente le push —
      #     boucle de 3 tentatives pour couvrir le cas où un AUTRE push
      #     arrive pendant cette resynchronisation elle-même.
      #   - CONFLIT réel (`git rebase` échoue, contenu qui se recouvre) :
      #     seul signe possible d'un DEUXIÈME run sur la MÊME commune
      #     ayant tourné en parallèle malgré le groupe de concurrence
      #     ci-dessus (cause exacte non confirmée, voir la conversation).
      #     Aucune tentative de fusion automatique sur des fichiers
      #     binaires (Excel, sqlite3) — un openpyxl mal fusionné peut
      #     corrompre silencieusement le fichier. On abandonne le rebase
      #     proprement (`--abort`) et on échoue tout de suite, sans
      #     boucler pour rien sur un conflit qui ne se résoudra jamais
      #     tout seul.
      - name: Committer l'état (Excel + registre) si modifié
        run: |
          git config user.name "walon-map-france-cloud bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/ registry_data/column_registry.sqlite3 registry_data/cellules_a_revisiter.csv
          if git diff --staged --quiet; then
            echo "Rien à committer."
            exit 0
          fi
          git commit -m "Traitement automatique : ${{ inputs.commune }} (${{ inputs.mode }}/${{ inputs.traitement }})"
          for tentative in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejeté (tentative $tentative/3) — resynchronisation avec origin/main avant nouvel essai."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Conflit de fusion réel sur state/ ou registry_data/ (pas juste un retard de synchronisation) — probablement un DEUXIÈME run sur la MÊME commune ayant tourné en parallèle malgré le groupe de concurrence. Aucune fusion automatique tentée sur des fichiers binaires. État de CE run non commité (perdu) ; relancer le workflow en mode 'continuer' pour reprendre depuis l'état déjà sur origin/main."
              git rebase --abort
              exit 1
            fi
          done
          echo "::error::Échec du push après 3 tentatives (rejets répétés sans conflit) — état local NON perdu sur ce runner (voir logs), mais non commité côté dépôt. Relancer le workflow."
          exit 1
